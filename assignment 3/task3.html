<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VaultofCodes - Certificate Verifier</title>
  <link rel="stylesheet" href="task3.css"/>
  <link href="stylesheet" rel="stylesheet">
  <script src="task3.js"></script>
</head>
<body>
  <header class="brand-header">
    <div class="header-content">
      <img src="logo.png" alt="VaultofCodes Logo" class="brand-logo" onerror="this.style.display='none'" />
      <h1 class="brand-title">VaultofCodes</h1>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="header-text">
        <h2>Verify Student Certificate</h2>
        <p>Enter a student's email or ID to validate their credentials.</p>
      </div>
      <div class="search-box">
        <input id="identifier" type="text" placeholder="e.g. john@example.com"/>
        <button onclick="verifyStudent()">Verify</button>
      </div>
    </div>

    <div class="spinner-container hidden" id="spinnerContainer">
      <div class="spinner"></div>
    </div>

    <div id="result"></div>
  </main>

  <div id="toast"></div>

  <script src="task3.js"></script>
</body>
</html>
